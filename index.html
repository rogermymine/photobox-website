<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photobox</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      color: #222;
      text-align: center;
    }

    header {
      padding: 25px;
      background: white;
      font-size: 24px;
      font-weight: bold;
    }

    .camera-section {
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #666;
    }

    .camera-box {
      max-width: 700px;
      margin: auto;
      background: #111;
      border-radius: 20px;
      padding: 15px;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 15px;
      transform: scaleX(-1);
    }

    .controls {
      margin-top: 25px;
    }

    button {
      border: none;
      padding: 16px 35px;
      border-radius: 30px;
      background: #222;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    #timer {
      font-size: 60px;
      font-weight: bold;
      margin: 20px;
      min-height: 70px;
    }

    #result {
      margin-top: 40px;
    }

    #photo {
      max-width: 90%;
      border-radius: 15px;
      display: none;
      margin: 20px auto;
    }

    .download {
      display: none;
      text-decoration: none;
      background: #222;
      color: white;
      padding: 14px 30px;
      border-radius: 30px;
    }

    footer {
      margin-top: 60px;
      padding: 25px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    YOUR PHOTOBOX
  </header>

  <section class="camera-section">

    <h1>Capture Your Moment ✦</h1>

    <p class="subtitle">
      Take your photo directly from our photobox.
    </p>

    <div class="camera-box">

      <video id="camera" autoplay playsinline></video>

    </div>

    <div id="timer"></div>

    <div class="controls">

      <button onclick="startCamera()">
        📸 Start Camera
      </button>

      <button onclick="startPhotobooth()" id="boothButton">
        Start Photobooth
      </button>

    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <div id="result">

      <h2>Your Photos</h2>

      <div id="photoGrid"></div>

      <div id="photostrip"></div>

<button onclick="createPhotostrip()" id="createStripButton"
style="display:none;">
  ✨ Create Photostrip
</button>

<a id="downloadStrip"
class="download"
download="photostrip.jpg"
style="display:none;">
  💾 Download Photostrip
</a>

      <button onclick="retakeAll()" id="retakeAllButton"
    style="display:none;">
           Retake All
      </button>

    </div>

  </section>

  <footer>
    © 2026 Your Photobox
  </footer>


  <script>
const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const photo = document.getElementById("photo");
const download = document.getElementById("download");
const timer = document.getElementById("timer");

let stream = null;

async function startCamera() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("Browser tidak mendukung akses kamera di halaman ini.");
      return;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    alert("Kamera berhasil terhubung!");

  } catch (error) {
    alert("Kamera gagal dibuka: " + error.name + " - " + error.message);
    console.error(error);
  }
}

let photos = [];
let currentPhoto = 0;

function startPhotobooth() {

  if (!stream) {
    alert("Nyalakan kamera dulu dengan tombol Start Camera.");
    return;
  }

  photos = [];
  currentPhoto = 0;

  document.getElementById("photoGrid").innerHTML = "";
  document.getElementById("retakeAllButton").style.display = "none";

  takeBoothPhoto();
}


function takeBoothPhoto() {

  currentPhoto++;

  let count = 5;

  timer.innerText = count;

  const countdown = setInterval(() => {

    count--;

    if (count > 0) {

      timer.innerText = count;

    } else {

      clearInterval(countdown);

      timer.innerText = "📸";

      setTimeout(() => {

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext("2d");

        context.save();

        context.translate(canvas.width, 0);
        context.scale(-1, 1);

        context.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        context.restore();

        const image = canvas.toDataURL("image/jpeg", 0.95);

        photos[currentPhoto - 1] = image;

        showPhoto(currentPhoto - 1, image);

        timer.innerText = "";

        if (currentPhoto < 4) {

          setTimeout(() => {
            takeBoothPhoto();
          }, 1000);

        } else {

          document.getElementById("retakeAllButton").style.display = "inline-block";

          document.getElementById("createStripButton").style.display = "inline-block";

        }

      }, 500);

    }

  }, 1000);

}
function showPhoto(index, image) {

  const grid = document.getElementById("photoGrid");

  let oldPhoto = document.getElementById("photo-" + index);

  if (oldPhoto) {
    oldPhoto.remove();
  }

  const box = document.createElement("div");

  box.id = "photo-" + index;

  box.style.margin = "20px";
  box.style.display = "inline-block";
  box.style.verticalAlign = "top";

  box.innerHTML = `
    <h3>Foto ${index + 1}</h3>

    <img
      src="${image}"
      style="
        width:220px;
        border-radius:15px;
        display:block;
        margin:10px auto;
      "
    >

    <button onclick="retakePhoto(${index})">
      ↻ Retake Foto ${index + 1}
    </button>
  `;

  grid.appendChild(box);
}


function retakePhoto(index) {

  if (!stream) {
    alert("Nyalakan kamera dulu.");
    return;
  }

  currentPhoto = index + 1;

  timer.innerText = "5";

  let count = 5;

  const countdown = setInterval(() => {

    count--;

    if (count > 0) {

      timer.innerText = count;

    } else {

      clearInterval(countdown);

      timer.innerText = "📸";

      setTimeout(() => {

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext("2d");

        context.save();

        context.translate(canvas.width, 0);
        context.scale(-1, 1);

        context.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        context.restore();

        const image = canvas.toDataURL("image/jpeg", 0.95);

        photos[index] = image;

        showPhoto(index, image);

        timer.innerText = "";

      }, 500);
    }

  }, 1000);
}


function retakeAll() {

  photos = [];
  currentPhoto = 0;

  document.getElementById("photoGrid").innerHTML = "";

  document.getElementById("retakeAllButton").style.display = "none";

  startPhotobooth();
}

    function createPhotostrip() {

  if (photos.length < 4) {
    alert("Selesaikan 4 foto dulu.");
    return;
  }

  const stripCanvas = document.createElement("canvas");
  const ctx = stripCanvas.getContext("2d");

  const width = 700;
  const photoHeight = 500;
  const gap = 20;
  const padding = 30;
  const footerHeight = 100;

  stripCanvas.width = width;
  stripCanvas.height =
    padding +
    (photoHeight * 4) +
    (gap * 3) +
    footerHeight +
    padding;

  // Background putih
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(
    0,
    0,
    stripCanvas.width,
    stripCanvas.height
  );

  let loaded = 0;

  photos.forEach((image, index) => {

    const img = new Image();

    img.onload = function() {

      const y =
        padding +
        (index * (photoHeight + gap));

      // Foto
      ctx.drawImage(
        img,
        padding,
        y,
        width - (padding * 2),
        photoHeight
      );

      loaded++;

      if (loaded === 4) {

        // Footer
        const footerY =
          padding +
          (photoHeight * 4) +
          (gap * 3);

        ctx.fillStyle = "#ffffff";

        ctx.fillRect(
          0,
          footerY,
          width,
          footerHeight
        );

        ctx.fillStyle = "#222222";
        ctx.font = "bold 28px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
          "YOUR PHOTOBOX ✦",
          width / 2,
          footerY + 60
        );

        const finalImage =
          stripCanvas.toDataURL(
            "image/jpeg",
            0.95
          );

        const strip =
          document.getElementById("photostrip");

        strip.innerHTML = `
          <h2 style="margin:30px 0 15px;">
            Your Photostrip ✨
          </h2>

          <img
            src="${finalImage}"
            style="
              width:100%;
              max-width:380px;
              border-radius:10px;
              box-shadow:0 10px 30px rgba(0,0,0,0.15);
            "
          >
        `;

        const downloadStrip =
          document.getElementById("downloadStrip");

        downloadStrip.href = finalImage;
        downloadStrip.style.display =
          "inline-block";

        downloadStrip.style.margin =
          "20px 0";

      }
    };

    img.src = image;

  });
}
</script>
</body>
</html>
