<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Photobox ♡</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Trebuchet MS", Arial, sans-serif;
  background:
    radial-gradient(circle at 10% 10%, #f8dce7 0, transparent 25%),
    radial-gradient(circle at 90% 20%, #e5def8 0, transparent 25%),
    linear-gradient(135deg, #fffaf7, #f8f1f5);
  color: #4d4148;
  text-align: center;
  min-height: 100vh;
}

header {
  padding: 24px 20px;
  background: rgba(255,255,255,.8);
  backdrop-filter: blur(10px);
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 4px;
  color: #806274;
}

header span {
  color: #c58ba5;
}

.camera-section {
  padding: 45px 18px 60px;
  max-width: 900px;
  margin: auto;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(34px,7vw,56px);
  color: #6e5864;
  margin-bottom: 10px;
}

.subtitle {
  color: #9a858f;
  margin-bottom: 30px;
}

.camera-box {
  max-width: 720px;
  margin: auto;
  padding: 10px;
  background: linear-gradient(135deg,#dca9bd,#bca9d8);
  border-radius: 28px;
  box-shadow: 0 20px 50px rgba(120,90,110,.18);
}

.camera-box::before {
  content: "♡ PHOTO TIME ♡";
  display: block;
  color: white;
  font-size: 12px;
  letter-spacing: 3px;
  padding: 10px;
}

video {
  width: 100%;
  display: block;
  border-radius: 20px;
  transform: scaleX(-1);
  background: #eee;
}

#timer {
  font-size: 64px;
  font-weight: bold;
  color: #a56f89;
  margin: 20px;
  min-height: 75px;
}

.session-box {
  width: 230px;
  margin: 15px auto 25px;
  padding: 15px 20px;
  background: rgba(255,255,255,.8);
  border-radius: 22px;
  box-shadow: 0 10px 30px rgba(120,90,110,.1);
}

.session-label {
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: bold;
  color: #a58b98;
}

#sessionTimer {
  font-size: 38px;
  font-weight: bold;
  letter-spacing: 3px;
  color: #765b69;
}

button {
  border: none;
  padding: 14px 25px;
  border-radius: 50px;
  background: linear-gradient(135deg,#b985a0,#927da9);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
  box-shadow: 0 8px 20px rgba(140,100,140,.18);
  transition: .2s;
}

button:hover {
  transform: translateY(-2px);
}

button:disabled {
  opacity: .35;
  cursor: not-allowed;
  transform: none;
}

#result {
  margin-top: 50px;
}

#result h2 {
  font-family: Georgia,serif;
  font-size: 30px;
  color: #765d69;
  margin-bottom: 20px;
}

#photoGrid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 18px;
}

.photo-box {
  width: 240px;
  padding: 15px;
  background: rgba(255,255,255,.85);
  border-radius: 22px;
  box-shadow: 0 12px 30px rgba(110,80,100,.12);
}

.photo-box h3 {
  color: #967487;
  font-size: 15px;
  margin-bottom: 10px;
}

.photo-box img {
  width: 100%;
  border-radius: 15px;
  display: block;
  margin-bottom: 12px;
}

/* FRAME PICKER */

#framePicker {
  display: none;
  margin: 45px auto 25px;
  padding: 25px 15px;
  max-width: 850px;
  background: rgba(255,255,255,.7);
  border-radius: 28px;
  box-shadow: 0 15px 40px rgba(110,80,100,.1);
}

#framePicker h2 {
  margin-bottom: 20px;
  font-family: Georgia,serif;
}

.frames {
  display: grid;
  grid-template-columns: repeat(5,1fr);
  gap: 12px;
}

.frame-option {
  padding: 12px 5px;
  border: 2px solid transparent;
  border-radius: 18px;
  background: #fff;
  color: #765d69;
  cursor: pointer;
}

.frame-option.selected {
  border-color: #b985a0;
  background: #f8e8ef;
}

.frame-preview {
  width: 100%;
  height: 95px;
  border-radius: 12px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 28px;
}

.pink {
  background: linear-gradient(135deg,#ffdce9,#f3b8ce);
}

.sakura {
  background:
    radial-gradient(circle,#fff 0 5px,transparent 6px),
    #f6cbdc;
}

.swan {
  background: linear-gradient(135deg,#fff,#e6e0f2);
}

.cloud {
  background: linear-gradient(135deg,#dceeff,#f7fbff);
}

.lavender {
  background: linear-gradient(135deg,#ddd0f2,#bfa9dd);
}

.starry {
  background: linear-gradient(135deg,#393252,#8375a9);
  color: white;
}

.teddy {
  background: linear-gradient(135deg,#e9c8aa,#c99c73);
}

.strawberry {
  background: linear-gradient(135deg,#ffc4d0,#ed8099);
}

.blue {
  background: linear-gradient(135deg,#ccecff,#91c9e8);
}

.minimal {
  background: #eeeae7;
}

/* STRIP */

#photostrip {
  margin-top: 40px;
}

#photostrip img {
  width: 100%;
  max-width: 380px;
  border-radius: 16px;
  border: 8px solid white;
  box-shadow: 0 20px 45px rgba(100,70,90,.2);
}

.download {
  display: none;
  text-decoration: none;
  background: linear-gradient(135deg,#b985a0,#927da9);
  color: white;
  padding: 14px 28px;
  border-radius: 50px;
  margin: 20px 0;
  font-weight: bold;
}

footer {
  margin-top: 60px;
  padding: 30px 20px;
  background: rgba(110,85,100,.95);
  color: #f9edf3;
  letter-spacing: 2px;
}

@media(max-width:650px) {
  .frames {
    grid-template-columns: repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  YOUR <span>PHOTOBOX</span> ♡
</header>

<section class="camera-section">

<h1>Capture Your Moment ✦</h1>

<p class="subtitle">
  little moments, pretty memories ♡
</p>

<div class="camera-box">
  <video id="camera" autoplay playsinline></video>
</div>

<div id="timer"></div>

<div class="session-box">
  <div class="session-label">⏱ TIME LEFT</div>
  <div id="sessionTimer">05:00</div>
</div>

<div>
  <button onclick="startCamera()" id="cameraButton">
    📸 Start Camera
  </button>

  <button onclick="startPhotobooth()" id="boothButton">
    ✨ Start Photobooth
  </button>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<div id="result">

<h2>Your Photos ♡</h2>

<div id="photoGrid"></div>

<!-- FRAME PICKER -->

<div id="framePicker">

<h2>Choose Your Frame ✦</h2>

<div class="frames">

<div class="frame-option selected" onclick="selectFrame('pink',this)">
<div class="frame-preview pink">🎀</div>
Pink Ribbon
</div>

<div class="frame-option" onclick="selectFrame('sakura',this)">
<div class="frame-preview sakura">🌸</div>
Sakura
</div>

<div class="frame-option" onclick="selectFrame('swan',this)">
<div class="frame-preview swan">🦢</div>
Soft Swan
</div>

<div class="frame-option" onclick="selectFrame('cloud',this)">
<div class="frame-preview cloud">☁️</div>
Cloudy
</div>

<div class="frame-option" onclick="selectFrame('lavender',this)">
<div class="frame-preview lavender">💜</div>
Lavender
</div>

<div class="frame-option" onclick="selectFrame('starry',this)">
<div class="frame-preview starry">⭐</div>
Starry
</div>

<div class="frame-option" onclick="selectFrame('teddy',this)">
<div class="frame-preview teddy">🧸</div>
Teddy
</div>

<div class="frame-option" onclick="selectFrame('strawberry',this)">
<div class="frame-preview strawberry">🍓</div>
Strawberry
</div>

<div class="frame-option" onclick="selectFrame('blue',this)">
<div class="frame-preview blue">🫧</div>
Baby Blue
</div>

<div class="frame-option" onclick="selectFrame('minimal',this)">
<div class="frame-preview minimal">♡</div>
Minimal
</div>

</div>

<br>

<button onclick="createPhotostrip()">
✨ Create Photostrip
</button>

</div>

<div id="photostrip"></div>

<a id="downloadStrip"
class="download"
download="photostrip.jpg">
💾 Download Photostrip
</a>

<br>

<button onclick="retakeAll()" id="retakeAllButton" style="display:none;">
↻ Retake All
</button>

</div>
</section>

<footer>
2026 YOUR PHOTOBOX
</footer>


<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const timer = document.getElementById("timer");

let stream = null;
let photos = [];
let currentPhoto = 0;

let sessionTime = 300;
let sessionInterval = null;
let sessionActive = false;

let selectedFrame = "pink";


/* CAMERA */

async function startCamera() {

try {

if (!navigator.mediaDevices ||
!navigator.mediaDevices.getUserMedia) {

alert("Browser tidak mendukung akses kamera.");
return;

}

stream = await navigator.mediaDevices.getUserMedia({
video:{facingMode:"user"},
audio:false
});

video.srcObject = stream;
await video.play();

alert("Kamera berhasil terhubung! ♡");

}

catch(error) {

alert(
"Kamera gagal dibuka: "+
error.name+
" - "+
error.message
);

}

}


/* SESSION */

function startSessionTimer() {

sessionTime = 300;
sessionActive = true;

updateSessionTimer();

sessionInterval = setInterval(() => {

sessionTime--;

updateSessionTimer();

if(sessionTime <= 0) {

clearInterval(sessionInterval);

sessionActive = false;
sessionTime = 0;

updateSessionTimer();

document.getElementById("boothButton").disabled = true;
document.getElementById("retakeAllButton").disabled = true;

alert(
"⏰ Waktu photobox sudah habis! Kamu masih bisa memilih frame dan download hasil foto ♡"
);

}

},1000);

}


function updateSessionTimer() {

const minutes =
Math.floor(sessionTime/60);

const seconds =
sessionTime%60;

document.getElementById("sessionTimer").innerText =
String(minutes).padStart(2,"0")+
":"+
String(seconds).padStart(2,"0");

}


/* START PHOTOBOX */

function startPhotobooth() {

if(!stream) {

alert("Nyalakan kamera dulu dengan Start Camera.");
return;

}

if(!sessionActive) {
startSessionTimer();
}

photos=[];
currentPhoto=0;

document.getElementById("photoGrid").innerHTML="";
document.getElementById("photostrip").innerHTML="";
document.getElementById("framePicker").style.display="none";
document.getElementById("downloadStrip").style.display="none";
document.getElementById("retakeAllButton").style.display="none";

takeBoothPhoto();

}


/* TAKE PHOTO */

function takeBoothPhoto() {

if(!sessionActive) return;

currentPhoto++;

let count=5;

timer.innerText=count;

const countdown=setInterval(()=>{

count--;

if(count>0) {

timer.innerText=count;

}

else {

clearInterval(countdown);

timer.innerText="📸";

setTimeout(()=>{

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext("2d");

ctx.save();

ctx.translate(canvas.width,0);
ctx.scale(-1,1);

ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);

ctx.restore();

const image=
canvas.toDataURL("image/jpeg",.95);

photos[currentPhoto-1]=image;

showPhoto(currentPhoto-1,image);

timer.innerText="";

if(currentPhoto<4 && sessionActive) {

setTimeout(()=>{
takeBoothPhoto();
},1000);

}

else {

document.getElementById("retakeAllButton").style.display="inline-block";

document.getElementById("framePicker").style.display="block";

}

},500);

}

},1000);

}


/* SHOW PHOTO */

function showPhoto(index,image) {

let old=document.getElementById("photo-"+index);

if(old) old.remove();

const box=document.createElement("div");

box.id="photo-"+index;
box.className="photo-box";

box.innerHTML=`

<h3>✦ Foto ${index+1} ✦</h3>

<img src="${image}">

<button onclick="retakePhoto(${index})">
↻ Retake Foto
</button>

`;

document.getElementById("photoGrid").appendChild(box);

}


/* RETAKE ONE */

function retakePhoto(index) {

if(!sessionActive) {

alert("⏰ Waktu photobox sudah habis.");
return;

}

let count=5;

timer.innerText=count;

const countdown=setInterval(()=>{

count--;

if(count>0) {

timer.innerText=count;

}

else {

clearInterval(countdown);

timer.innerText="📸";

setTimeout(()=>{

canvas.width=video.videoWidth;
canvas.height=video.videoHeight;

const ctx=canvas.getContext("2d");

ctx.save();

ctx.translate(canvas.width,0);
ctx.scale(-1,1);

ctx.drawImage(
video,
0,
0,
canvas.width,
canvas.height
);

ctx.restore();

const image=
canvas.toDataURL("image/jpeg",.95);

photos[index]=image;

showPhoto(index,image);

timer.innerText="";

},500);

}

},1000);

}


/* RETAKE ALL */

function retakeAll() {

if(!sessionActive) {

alert("⏰ Waktu photobox sudah habis.");
return;

}

photos=[];
currentPhoto=0;

document.getElementById("photoGrid").innerHTML="";
document.getElementById("photostrip").innerHTML="";
document.getElementById("framePicker").style.display="none";
document.getElementById("downloadStrip").style.display="none";

startPhotobooth();

}


/* SELECT FRAME */

function selectFrame(frame,element) {

selectedFrame=frame;

document.querySelectorAll(".frame-option")
.forEach(el=>{
el.classList.remove("selected");
});

element.classList.add("selected");

}


/* CREATE STRIP */

function createPhotostrip() {

if(photos.length<4) {

alert("Selesaikan 4 foto dulu.");
return;

}

const stripCanvas=document.createElement("canvas");
const ctx=stripCanvas.getContext("2d");

const width=700;
const photoHeight=500;
const gap=20;
const padding=30;
const footerHeight=120;

stripCanvas.width=width;

stripCanvas.height=
padding+
(photoHeight*4)+
(gap*3)+
footerHeight+
padding;


/* BACKGROUND */

let bg="#fffaf8";

if(selectedFrame==="pink")
bg="#ffe8f0";

if(selectedFrame==="sakura")
bg="#ffe9f0";

if(selectedFrame==="swan")
bg="#f4f0fa";

if(selectedFrame==="cloud")
bg="#eaf6ff";

if(selectedFrame==="lavender")
bg="#eee5fa";

if(selectedFrame==="starry")
bg="#393252";

if(selectedFrame==="teddy")
bg="#ead1b7";

if(selectedFrame==="strawberry")
bg="#ffdce4";

if(selectedFrame==="blue")
bg="#dff4ff";

if(selectedFrame==="minimal")
bg="#f0ece9";

ctx.fillStyle=bg;

ctx.fillRect(
0,
0,
stripCanvas.width,
stripCanvas.height
);


/* DECORATION */

ctx.textAlign="center";

let decoration="♡";

if(selectedFrame==="pink")
decoration="🎀";

if(selectedFrame==="sakura")
decoration="🌸";

if(selectedFrame==="swan")
decoration="🦢";

if(selectedFrame==="cloud")
decoration="☁";

if(selectedFrame==="lavender")
decoration="✦";

if(selectedFrame==="starry")
decoration="★";

if(selectedFrame==="teddy")
decoration="🧸";

if(selectedFrame==="strawberry")
decoration="🍓";

if(selectedFrame==="blue")
decoration="🫧";

if(selectedFrame==="minimal")
decoration="♡";


ctx.font="35px Arial";

ctx.fillText(
decoration,
width/2,
25
);


let loaded=0;

photos.forEach((image,index)=>{

const img=new Image();

img.onload=function(){

const y=
padding+
(index*(photoHeight+gap));

/* PHOTO */

ctx.drawImage(
img,
padding,
y,
width-(padding*2),
photoHeight
);


/* FRAME DETAILS */

ctx.lineWidth=8;

if(selectedFrame==="starry") {

ctx.strokeStyle="#e8d9ff";

}
else {

ctx.strokeStyle="rgba(255,255,255,.9)";

}

ctx.strokeRect(
padding,
y,
width-(padding*2),
photoHeight
);


loaded++;


if(loaded===4) {

const footerY=
padding+
(photoHeight*4)+
(gap*3);


/* FOOTER */

ctx.font="bold 28px Arial";

if(selectedFrame==="starry")
ctx.fillStyle="#ffffff";
else
ctx.fillStyle="#765d69";

ctx.fillText(
decoration+"  YOUR PHOTOBOX  "+decoration,
width/2,
footerY+55
);

ctx.font="16px Arial";

ctx.fillText(
"little moments, pretty memories ♡",
width/2,
footerY+85
);


const finalImage=
stripCanvas.toDataURL(
"image/jpeg",
.95
);


document.getElementById("photostrip").innerHTML=`

<h2>Your Photostrip ✨</h2>

<img src="${finalImage}">

`;


const download=
document.getElementById("downloadStrip");

download.href=finalImage;

download.style.display="inline-block";

}

};

img.src=image;

});

}

</script>

</body>
</html>
