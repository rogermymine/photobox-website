<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photobox</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      color: #222;
      text-align: center;
    }

    header {
      padding: 25px;
      background: white;
      font-size: 24px;
      font-weight: bold;
    }

    .camera-section {
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #666;
    }

    .camera-box {
      max-width: 700px;
      margin: auto;
      background: #111;
      border-radius: 20px;
      padding: 15px;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 15px;
      transform: scaleX(-1);
    }

    .controls {
      margin-top: 25px;
    }

    button {
      border: none;
      padding: 16px 35px;
      border-radius: 30px;
      background: #222;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    #timer {
      font-size: 60px;
      font-weight: bold;
      margin: 20px;
      min-height: 70px;
    }

    #result {
      margin-top: 40px;
    }

    #photo {
      max-width: 90%;
      border-radius: 15px;
      display: none;
      margin: 20px auto;
    }

    .download {
      display: none;
      text-decoration: none;
      background: #222;
      color: white;
      padding: 14px 30px;
      border-radius: 30px;
    }

    footer {
      margin-top: 60px;
      padding: 25px;
      background: #222;
      color: white;
    }
  </style>
</head>

    YOUR PHOTOBOX
  </header>

      <img id="photo">

      <br>

      <a id="download" class="download" download="photobox.jpg">
        Download Photo
      </a>

    </div>

  </section>

  <footer>
    © 2026 Your Photobox
  </footer>
