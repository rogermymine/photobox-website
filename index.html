<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Your Photobox</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      color: #222;
      text-align: center;
    }

    header {
      padding: 25px;
      background: white;
      font-size: 24px;
      font-weight: bold;
    }

    .camera-section {
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #666;
    }

    .camera-box {
      max-width: 700px;
      margin: auto;
      background: #111;
      border-radius: 20px;
      padding: 15px;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 15px;
      transform: scaleX(-1);
    }

    .controls {
      margin-top: 25px;
    }

    button {
      border: none;
      padding: 16px 35px;
      border-radius: 30px;
      background: #222;
      color: white;
      font-size: 17px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      opacity: 0.8;
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* FOTO COUNTDOWN */

    #timer {
      font-size: 60px;
      font-weight: bold;
      margin: 20px;
      min-height: 70px;
    }

    /* SESSION TIMER */

    .session-box {
      width: 220px;
      margin: 20px auto;
      padding: 15px 20px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .session-label {
      font-size: 13px;
      letter-spacing: 2px;
      font-weight: bold;
      color: #888;
      margin-bottom: 5px;
    }

    #sessionTimer {
      font-size: 38px;
      font-weight: bold;
      letter-spacing: 2px;
      color: #222;
    }

    /* RESULT */

    #result {
      margin-top: 40px;
    }

    #photoGrid {
      margin-top: 20px;
    }

    .photo-box {
      margin: 20px;
      display: inline-block;
      vertical-align: top;
    }

    .photo-box img {
      width: 220px;
      border-radius: 15px;
      display: block;
      margin: 10px auto;
    }

    /* PHOTO STRIP */

    #photostrip {
      margin-top: 30px;
    }

    #photostrip img {
      width: 100%;
      max-width: 380px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    }

    .download {
      display: none;
      text-decoration: none;
      background: #222;
      color: white;
      padding: 14px 30px;
      border-radius: 30px;
      margin: 20px 0;
    }

    footer {
      margin-top: 60px;
      padding: 25px;
      background: #222;
      color: white;
    }

  </style>

</head>


<body>

  <header>
    YOUR PHOTOBOX
  </header>


  <section class="camera-section">

    <h1>
      Capture Your Moment ✦
    </h1>

    <p class="subtitle">
      Take your photo directly from our photobox.
    </p>


    <!-- CAMERA -->

    <div class="camera-box">

      <video
        id="camera"
        autoplay
        playsinline>
      </video>

    </div>


    <!-- FOTO COUNTDOWN -->

    <div id="timer"></div>


    <!-- SESSION TIMER -->

    <div class="session-box">

      <div class="session-label">
        ⏱️ TIME LEFT
      </div>

      <div id="sessionTimer">
        05:00
      </div>

    </div>


    <!-- BUTTONS -->

    <div class="controls">

      <button
        onclick="startCamera()"
        id="cameraButton">

        📸 Start Camera

      </button>


      <button
        onclick="startPhotobooth()"
        id="boothButton">

        Start Photobooth

      </button>

    </div>


    <canvas
      id="canvas"
      style="display:none;">
    </canvas>


    <!-- RESULT -->

    <div id="result">

      <h2>
        Your Photos
      </h2>


      <div id="photoGrid"></div>


      <!-- PHOTO STRIP -->

      <div id="photostrip"></div>


      <button
        onclick="createPhotostrip()"
        id="createStripButton"
        style="display:none;">

        ✨ Create Photostrip

      </button>


      <br>


      <a
        id="downloadStrip"
        class="download"
        download="photostrip.jpg">

        💾 Download Photostrip

      </a>


      <br>


      <button
        onclick="retakeAll()"
        id="retakeAllButton"
        style="display:none;">

        🔄 Retake All

      </button>

    </div>

  </section>


  <footer>

    © 2026 Your Photobox

  </footer>


<script>


/* =========================
   ELEMENTS
========================= */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("canvas");

const timer =
  document.getElementById("timer");


/* =========================
   VARIABLES
========================= */

let stream = null;

let photos = [];

let currentPhoto = 0;


/* SESSION 5 MENIT */

let sessionTime = 300;

let sessionInterval = null;

let sessionActive = false;


/* =========================
   START CAMERA
========================= */

async function startCamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      alert(
        "Browser tidak mendukung akses kamera."
      );

      return;

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    alert(
      "Kamera berhasil terhubung!"
    );

  }

  catch (error) {

    alert(
      "Kamera gagal dibuka: " +
      error.name +
      " - " +
      error.message
    );

    console.error(error);

  }

}


/* =========================
   START PHOTO SESSION
========================= */

function startPhotobooth() {

  if (!stream) {

    alert(
      "Nyalakan kamera dulu dengan tombol Start Camera."
    );

    return;

  }


  if (!sessionActive) {

    startSessionTimer();

  }


  photos = [];

  currentPhoto = 0;


  document.getElementById(
    "photoGrid"
  ).innerHTML = "";


  document.getElementById(
    "photostrip"
  ).innerHTML = "";


  document.getElementById(
    "downloadStrip"
  ).style.display = "none";


  document.getElementById(
    "createStripButton"
  ).style.display = "none";


  document.getElementById(
    "retakeAllButton"
  ).style.display = "none";


  takeBoothPhoto();

}


/* =========================
   TAKE 4 PHOTOS
========================= */

function takeBoothPhoto() {

  if (!sessionActive) {

    alert(
      "Waktu photobox sudah habis."
    );

    return;

  }


  currentPhoto++;


  let count = 5;

  timer.innerText = count;


  const countdown =
    setInterval(() => {

      count--;


      if (count > 0) {

        timer.innerText =
          count;

      }

      else {

        clearInterval(
          countdown
        );


        timer.innerText =
          "📸";


        setTimeout(() => {


          canvas.width =
            video.videoWidth;


          canvas.height =
            video.videoHeight;


          const context =
            canvas.getContext(
              "2d"
            );


          context.save();


          context.translate(
            canvas.width,
            0
          );


          context.scale(
            -1,
            1
          );


          context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );


          context.restore();


          const image =
            canvas.toDataURL(
              "image/jpeg",
              0.95
            );


          photos[
            currentPhoto - 1
          ] = image;


          showPhoto(
            currentPhoto - 1,
            image
          );


          timer.innerText =
            "";


          if (
            currentPhoto < 4 &&
            sessionActive
          ) {

            setTimeout(() => {

              takeBoothPhoto();

            }, 1000);

          }

          else {

            document.getElementById(
              "retakeAllButton"
            ).style.display =
              "inline-block";


            document.getElementById(
              "createStripButton"
            ).style.display =
              "inline-block";

          }


        }, 500);

      }


    }, 1000);

}


/* =========================
   SHOW PHOTO
========================= */

function showPhoto(
  index,
  image
) {

  const grid =
    document.getElementById(
      "photoGrid"
    );


  let oldPhoto =
    document.getElementById(
      "photo-" + index
    );


  if (oldPhoto) {

    oldPhoto.remove();

  }


  const box =
    document.createElement(
      "div"
    );


  box.id =
    "photo-" + index;


  box.className =
    "photo-box";


  box.innerHTML = `

    <h3>
      Foto ${index + 1}
    </h3>

    <img
      src="${image}"
    >

    <button
      onclick="retakePhoto(${index})">

      ↻ Retake Foto ${index + 1}

    </button>

  `;


  grid.appendChild(
    box
  );

}


/* =========================
   RETAKE ONE PHOTO
========================= */

function retakePhoto(
  index
) {

  if (!sessionActive) {

    alert(
      "Waktu photobox sudah habis."
    );

    return;

  }


  if (!stream) {

    alert(
      "Nyalakan kamera dulu."
    );

    return;

  }


  currentPhoto =
    index + 1;


  let count = 5;

  timer.innerText =
    count;


  const countdown =
    setInterval(() => {

      count--;


      if (count > 0) {

        timer.innerText =
          count;

      }

      else {

        clearInterval(
          countdown
        );


        timer.innerText =
          "📸";


        setTimeout(() => {


          canvas.width =
            video.videoWidth;


          canvas.height =
            video.videoHeight;


          const context =
            canvas.getContext(
              "2d"
            );


          context.save();


          context.translate(
            canvas.width,
            0
          );


          context.scale(
            -1,
            1
          );


          context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );


          context.restore();


          const image =
            canvas.toDataURL(
              "image/jpeg",
              0.95
            );


          photos[index] =
            image;


          showPhoto(
            index,
            image
          );


          timer.innerText =
            "";


        }, 500);

      }

    }, 1000);

}


/* =========================
   RETAKE ALL
========================= */

function retakeAll() {

  if (!sessionActive) {

    alert(
      "Waktu photobox sudah habis."
    );

    return;

  }


  photos = [];

  currentPhoto = 0;


  document.getElementById(
    "photoGrid"
  ).innerHTML = "";


  document.getElementById(
    "photostrip"
  ).innerHTML = "";


  document.getElementById(
    "downloadStrip"
  ).style.display =
    "none";


  document.getElementById(
    "createStripButton"
  ).style.display =
    "none";


  document.getElementById(
    "retakeAllButton"
  ).style.display =
    "none";


  startPhotobooth();

}


/* =========================
   CREATE PHOTO STRIP
========================= */

function createPhotostrip() {

  if (photos.length < 4) {

    alert(
      "Selesaikan 4 foto dulu."
    );

    return;

  }


  const stripCanvas =
    document.createElement(
      "canvas"
    );


  const ctx =
    stripCanvas.getContext(
      "2d"
    );


  const width = 700;

  const photoHeight = 500;

  const gap = 20;

  const padding = 30;

  const footerHeight = 100;


  stripCanvas.width =
    width;


  stripCanvas.height =
    padding +
    (photoHeight * 4) +
    (gap * 3) +
    footerHeight +
    padding;


  ctx.fillStyle =
    "#ffffff";


  ctx.fillRect(
    0,
    0,
    stripCanvas.width,
    stripCanvas.height
  );


  let loaded = 0;


  photos.forEach(
    (image, index) => {


      const img =
        new Image();


      img.onload =
        function() {


          const y =
            padding +
            (
              index *
              (
                photoHeight +
                gap
              )
            );


          ctx.drawImage(
            img,
            padding,
            y,
            width -
              (padding * 2),
            photoHeight
          );


          loaded++;


          if (loaded === 4) {


            const footerY =
              padding +
              (photoHeight * 4) +
              (gap * 3);


            ctx.fillStyle =
              "#ffffff";


            ctx.fillRect(
              0,
              footerY,
              width,
              footerHeight
            );


            ctx.fillStyle =
              "#222222";


            ctx.font =
              "bold 28px Arial";


            ctx.textAlign =
              "center";


            ctx.fillText(
              "YOUR PHOTOBOX ✦",
              width / 2,
              footerY + 60
            );


            const finalImage =
              stripCanvas.toDataURL(
                "image/jpeg",
                0.95
              );


            const strip =
              document.getElementById(
                "photostrip"
              );


            strip.innerHTML = `

              <h2
                style="
                  margin:30px 0 15px;
                "
              >
                Your Photostrip ✨
              </h2>

              <img
                src="${finalImage}"
              >

            `;


            const downloadStrip =
              document.getElementById(
                "downloadStrip"
              );


            downloadStrip.href =
              finalImage;


            downloadStrip.style.display =
              "inline-block";


          }

        };


      img.src =
        image;


    }

  );

}


/* =========================
   SESSION TIMER
   5 MINUTES
========================= */

function startSessionTimer() {


  sessionTime =
    300;


  sessionActive =
    true;


  updateSessionTimer();


  sessionInterval =
    setInterval(() => {


      sessionTime--;


      updateSessionTimer();


      if (
        sessionTime <= 0
      ) {


        clearInterval(
          sessionInterval
        );


        sessionActive =
          false;


        sessionTime =
          0;


        updateSessionTimer();


        document.getElementById(
          "boothButton"
        ).disabled =
          true;


        document.getElementById(
          "retakeAllButton"
        ).disabled =
          true;


        document.getElementById(
          "sessionTimer"
        ).innerText =
          "00:00";


        alert(
          "⏰ Waktu photobox sudah habis. Foto dan retake sudah dikunci. Kamu masih bisa memilih frame dan download hasil foto."
        );


      }


    }, 1000);

}


/* =========================
   UPDATE SESSION TIMER
========================= */

function updateSessionTimer() {


  const minutes =
    Math.floor(
      sessionTime / 60
    );


  const seconds =
    sessionTime % 60;


  document.getElementById(
    "sessionTimer"
  ).innerText =

    String(minutes)
      .padStart(2, "0")

    + ":" +

    String(seconds)
      .padStart(2, "0");

}


</script>

</body>
</html>
