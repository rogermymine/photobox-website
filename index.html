<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Photobox</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f7f1f4;
  color:#554750;
  min-height:100vh;
}

button{
  border:0;
  cursor:pointer;
  font-family:inherit;
}

.screen{
  min-height:100vh;
}

/* ================= HOME ================= */

#homeScreen{
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
  text-align:center;
  background:
    radial-gradient(circle at 15% 20%,#f3d7e3 0,transparent 28%),
    radial-gradient(circle at 85% 80%,#ded5ef 0,transparent 28%),
    #faf6f7;
}

.home-card{
  width:min(700px,100%);
  padding:60px 30px;
  background:rgba(255,255,255,.78);
  border:1px solid rgba(255,255,255,.9);
  border-radius:35px;
  box-shadow:0 25px 70px rgba(90,65,80,.15);
}

.logo{
  font-size:14px;
  letter-spacing:5px;
  color:#aa7d91;
  margin-bottom:25px;
}

.home-title{
  font-family:Georgia,serif;
  font-size:clamp(42px,8vw,72px);
  color:#66515d;
  margin-bottom:15px;
}

.home-subtitle{
  color:#9b858f;
  margin-bottom:40px;
  font-size:17px;
}

.start-btn{
  padding:20px 55px;
  border-radius:50px;
  color:white;
  font-size:18px;
  font-weight:bold;
  letter-spacing:1px;
  background:linear-gradient(135deg,#bd88a1,#8f7aa5);
  box-shadow:0 15px 30px rgba(150,110,140,.25);
  transition:.2s;
}

.start-btn:hover{
  transform:translateY(-3px);
}

/* ================= PHOTOBOOTH ================= */

#boothScreen{
  display:none;
  background:#201c21;
  color:white;
  padding:15px;
}

.booth-top{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 5px 15px;
}

.booth-logo{
  letter-spacing:4px;
  font-size:13px;
}

.session{
  background:#383139;
  padding:8px 15px;
  border-radius:20px;
  font-size:13px;
}

#sessionTimer{
  font-weight:bold;
  color:#f5c7d9;
}

.camera-area{
  max-width:1100px;
  margin:auto;
  position:relative;
}

.video-frame{
  background:#111;
  border-radius:25px;
  padding:8px;
  position:relative;
  overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.4);
}

video{
  width:100%;
  max-height:72vh;
  object-fit:cover;
  display:block;
  border-radius:20px;
  transform:scaleX(-1);
  background:#090909;
}

.photo-number{
  position:absolute;
  top:25px;
  left:25px;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(10px);
  padding:10px 17px;
  border-radius:30px;
  font-size:14px;
  z-index:3;
}

.countdown{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:clamp(90px,18vw,180px);
  font-weight:bold;
  text-shadow:0 5px 30px rgba(0,0,0,.5);
  pointer-events:none;
}

.get-ready{
  position:absolute;
  top:35%;
  left:0;
  right:0;
  text-align:center;
  font-size:clamp(25px,5vw,45px);
  font-weight:bold;
  letter-spacing:3px;
  text-shadow:0 4px 20px rgba(0,0,0,.5);
  pointer-events:none;
}

.booth-bottom{
  text-align:center;
  padding:18px;
}

.status{
  color:#cbbac3;
  font-size:14px;
}

/* ================= EDITOR ================= */

#editorScreen{
  display:none;
  min-height:100vh;
  padding:25px;
  background:
    radial-gradient(circle at 10% 10%,#f0d8e4 0,transparent 25%),
    radial-gradient(circle at 90% 90%,#ddd5ed 0,transparent 25%),
    #faf7f8;
}

.editor-title{
  text-align:center;
  font-family:Georgia,serif;
  font-size:38px;
  color:#66515d;
  margin:15px 0 8px;
}

.editor-subtitle{
  text-align:center;
  color:#9b858f;
  margin-bottom:25px;
}

.editor-layout{
  max-width:1150px;
  margin:auto;
  display:grid;
  grid-template-columns:minmax(280px,400px) 1fr;
  gap:30px;
  align-items:start;
}

.preview-card{
  background:white;
  padding:18px;
  border-radius:25px;
  box-shadow:0 20px 50px rgba(90,65,80,.13);
  text-align:center;
  position:sticky;
  top:20px;
}

#previewCanvas{
  width:100%;
  max-height:72vh;
  object-fit:contain;
  border-radius:12px;
  display:block;
  background:#eee;
}

.controls-card{
  background:rgba(255,255,255,.8);
  border-radius:25px;
  padding:22px;
  box-shadow:0 20px 50px rgba(90,65,80,.1);
}

.control-title{
  font-weight:bold;
  margin-bottom:15px;
  color:#735d68;
}

.frame-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:10px;
  margin-bottom:25px;
}

.frame-btn{
  background:white;
  border:2px solid #eee;
  border-radius:15px;
  padding:7px;
  color:#725d68;
  font-size:11px;
  transition:.15s;
}

.frame-btn.selected{
  border-color:#b985a0;
  background:#f9e8ef;
}

.frame-color{
  height:70px;
  border-radius:10px;
  margin-bottom:6px;
}

.pink{background:linear-gradient(135deg,#ffd6e5,#efa8c2)}
.sakura{background:linear-gradient(135deg,#ffe6ee,#f6b8ce)}
.lavender{background:linear-gradient(135deg,#e2d6f4,#bba7dc)}
.blue{background:linear-gradient(135deg,#d5efff,#91c9e9)}
.star{background:linear-gradient(135deg,#302b49,#8175a8)}
.cloud{background:linear-gradient(135deg,#eef8ff,#c7e5f8)}
.teddy{background:linear-gradient(135deg,#ead0b6,#c4976d)}
.strawberry{background:linear-gradient(135deg,#ffd1d9,#ef8ca1)}
.flower{background:linear-gradient(135deg,#f7dff0,#d5afd0)}
.minimal{background:#eeeae7}

.editor-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.tool-btn{
  padding:13px 18px;
  border-radius:30px;
  background:#f1e9ed;
  color:#715c67;
  font-weight:bold;
}

.download-btn{
  display:inline-block;
  text-decoration:none;
  padding:15px 25px;
  border-radius:30px;
  color:white;
  background:linear-gradient(135deg,#bd88a1,#8f7aa5);
  font-weight:bold;
  margin-top:15px;
}

.text-input{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:15px;
  margin-top:10px;
  outline:none;
}

/* ================= RESPONSIVE ================= */

@media(max-width:800px){

  .editor-layout{
    grid-template-columns:1fr;
  }

  .preview-card{
    position:relative;
    top:0;
    max-width:420px;
    margin:auto;
  }

  .frame-grid{
    grid-template-columns:repeat(5,1fr);
  }
}

@media(max-width:500px){

  .frame-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .home-card{
    padding:45px 20px;
  }

}
</style>
</head>

<body>

<!-- ================= HOME ================= -->

<section id="homeScreen" class="screen">

  <div class="home-card">

    <div class="logo">
      YOUR PHOTOBOX
    </div>

    <h1 class="home-title">
      Capture<br>Your Moment
    </h1>

    <p class="home-subtitle">
      Four photos. One beautiful memory. ♡
    </p>

    <button class="start-btn" onclick="enterBooth()">
      START PHOTOBOOTH
    </button>

  </div>

</section>


<!-- ================= BOOTH ================= -->

<section id="boothScreen" class="screen">

  <div class="booth-top">

    <div class="booth-logo">
      YOUR PHOTOBOX
    </div>

    <div class="session">
      SESSION <span id="sessionTimer">05:00</span>
    </div>

  </div>

  <div class="camera-area">

    <div class="video-frame">

      <video id="camera" autoplay playsinline></video>

      <div class="photo-number" id="photoNumber">
        READY
      </div>

      <div class="get-ready" id="getReady"></div>

      <div class="countdown" id="countdown"></div>

    </div>

  </div>

  <div class="booth-bottom">

    <div class="status" id="boothStatus">
      Connecting camera...
    </div>

  </div>

</section>


<!-- ================= EDITOR ================= -->

<section id="editorScreen" class="screen">

  <h1 class="editor-title">
    Make It Yours ✦
  </h1>

  <p class="editor-subtitle">
    Choose a frame and decorate your memories.
  </p>

  <div class="editor-layout">

    <div class="preview-card">

      <canvas id="previewCanvas"></canvas>

      <a id="downloadButton"
         class="download-btn"
         download="your-photobox.jpg">
        💾 DOWNLOAD
      </a>

    </div>


    <div class="controls-card">

      <div class="control-title">
        CHOOSE YOUR FRAME
      </div>

      <div class="frame-grid">

        <button class="frame-btn selected"
          onclick="selectFrame('pink',this)">
          <div class="frame-color pink"></div>
          Pink
        </button>

        <button class="frame-btn"
          onclick="selectFrame('sakura',this)">
          <div class="frame-color sakura"></div>
          Sakura
        </button>

        <button class="frame-btn"
          onclick="selectFrame('lavender',this)">
          <div class="frame-color lavender"></div>
          Lavender
        </button>

        <button class="frame-btn"
          onclick="selectFrame('blue',this)">
          <div class="frame-color blue"></div>
          Baby Blue
        </button>

        <button class="frame-btn"
          onclick="selectFrame('star',this)">
          <div class="frame-color star"></div>
          Starry
        </button>

        <button class="frame-btn"
          onclick="selectFrame('cloud',this)">
          <div class="frame-color cloud"></div>
          Cloud
        </button>

        <button class="frame-btn"
          onclick="selectFrame('teddy',this)">
          <div class="frame-color teddy"></div>
          Teddy
        </button>

        <button class="frame-btn"
          onclick="selectFrame('strawberry',this)">
          <div class="frame-color strawberry"></div>
          Strawberry
        </button>

        <button class="frame-btn"
          onclick="selectFrame('flower',this)">
          <div class="frame-color flower"></div>
          Flower
        </button>

        <button class="frame-btn"
          onclick="selectFrame('minimal',this)">
          <div class="frame-color minimal"></div>
          Minimal
        </button>

      </div>


      <div class="control-title">
        ADD TEXT
      </div>

      <input
        id="customText"
        class="text-input"
        placeholder="Tulis sesuatu... ♡"
        oninput="updateText()"
      >


      <div class="editor-buttons">

        <button class="tool-btn"
          onclick="addSticker('♡')">
          ♡
        </button>

        <button class="tool-btn"
          onclick="addSticker('☆')">
          ☆
        </button>

        <button class="tool-btn"
          onclick="addSticker('✦')">
          ✦
        </button>

        <button class="tool-btn"
          onclick="addSticker('🌸')">
          🌸
        </button>

        <button class="tool-btn"
          onclick="addSticker('🎀')">
          🎀
        </button>

        <button class="tool-btn"
          onclick="addSticker('✨')">
          ✨
        </button>

      </div>

      <div class="control-title" style="margin-top:25px;">
        DATE
      </div>

      <div class="editor-buttons">

        <button class="tool-btn"
          onclick="toggleDate()">
          📅 ADD DATE
        </button>

        <button class="tool-btn"
          onclick="clearDecorations()">
          ↺ RESET DECORATION
        </button>

      </div>

    </div>

  </div>

</section>


<script>

/* ================= VARIABLES ================= */

const video = document.getElementById("camera");
const countdown = document.getElementById("countdown");
const getReady = document.getElementById("getReady");
const photoNumber = document.getElementById("photoNumber");
const boothStatus = document.getElementById("boothStatus");
const sessionTimer = document.getElementById("sessionTimer");

let stream = null;

let photos = [];

let currentPhoto = 0;

let sessionSeconds = 300;

let sessionInterval = null;

let sessionActive = false;

let selectedFrame = "pink";

let customText = "";

let stickers = [];

let showDate = false;


/* ================= ENTER BOOTH ================= */

async function enterBooth(){

  document.getElementById("homeScreen").style.display="none";

  document.getElementById("boothScreen").style.display="block";

  try{

    stream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:"user"
        },
        audio:false
      });

    video.srcObject=stream;

    await video.play();

    boothStatus.innerText=
      "Get ready... ♡";

    startSession();

    setTimeout(()=>{
      startPhotoSequence();
    },1200);

  }

  catch(error){

    boothStatus.innerText=
      "Camera tidak dapat dibuka.";

    alert(
      "Kamera tidak bisa digunakan: "+
      error.message
    );

  }

}


/* ================= SESSION TIMER ================= */

function startSession(){

  sessionSeconds=300;

  sessionActive=true;

  updateSessionTimer();

  sessionInterval=setInterval(()=>{

    sessionSeconds--;

    updateSessionTimer();

    if(sessionSeconds<=0){

      clearInterval(sessionInterval);

      sessionActive=false;

      sessionSeconds=0;

      updateSessionTimer();

      boothStatus.innerText=
        "Session selesai.";

    }

  },1000);

}


function updateSessionTimer(){

  const min=
    Math.floor(sessionSeconds/60);

  const sec=
    sessionSeconds%60;

  sessionTimer.innerText=
    String(min).padStart(2,"0")+
    ":"+
    String(sec).padStart(2,"0");

}


/* ================= PHOTO SEQUENCE ================= */

function startPhotoSequence(){

  if(!sessionActive)return;

  photos=[];

  currentPhoto=0;

  nextPhoto();

}


function nextPhoto(){

  if(!sessionActive)return;

  if(currentPhoto>=4){

    finishBooth();

    return;

  }

  currentPhoto++;

  photoNumber.innerText=
    "PHOTO "+currentPhoto+" / 4";

  getReady.innerText=
    "GET READY!";

  countdown.innerText="";

  setTimeout(()=>{

    getReady.innerText="";

    runCountdown();

  },1200);

}


/* ================= COUNTDOWN ================= */

function runCountdown(){

  let number=5;

  countdown.innerText=number;

  const interval=setInterval(()=>{

    number--;

    if(number>0){

      countdown.innerText=number;

    }

    else{

      clearInterval(interval);

      countdown.innerText="📸";

      takePhoto();

    }

  },1000);

}


/* ================= TAKE PHOTO ================= */

function takePhoto(){

  if(!sessionActive)return;

  const canvas=document.createElement("canvas");

  const width=video.videoWidth;

  const height=video.videoHeight;

  canvas.width=width;

  canvas.height=height;

  const ctx=canvas.getContext("2d");

  ctx.save();

  ctx.translate(width,0);

  ctx.scale(-1,1);

  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );

  ctx.restore();

  photos.push(
    canvas.toDataURL(
      "image/jpeg",
      .95
    )
  );

  setTimeout(()=>{

    countdown.innerText="";

    if(currentPhoto<4){

      nextPhoto();

    }

    else{

      finishBooth();

    }

  },1000);

}


/* ================= FINISH ================= */

function finishBooth(){

  if(stream){

    stream.getTracks().forEach(
      track=>track.stop()
    );

  }

  document.getElementById("boothScreen").style.display="none";

  document.getElementById("editorScreen").style.display="block";

  drawPreview();

}


/* ================= FRAME ================= */

function selectFrame(frame,button){

  selectedFrame=frame;

  document.querySelectorAll(".frame-btn")
  .forEach(btn=>{
    btn.classList.remove("selected");
  });

  button.classList.add("selected");

  drawPreview();

}


/* ================= TEXT ================= */

function updateText(){

  customText=
    document.getElementById("customText").value;

  drawPreview();

}


/* ================= STICKER ================= */

function addSticker(sticker){

  stickers.push(sticker);

  drawPreview();

}


/* ================= DATE ================= */

function toggleDate(){

  showDate=!showDate;

  drawPreview();

}


/* ================= RESET ================= */

function clearDecorations(){

  stickers=[];

  customText="";

  showDate=false;

  document.getElementById("customText").value="";

  drawPreview();

}


/* ================= PREVIEW ================= */

function drawPreview(){

  if(photos.length<4)return;

  const canvas=
    document.getElementById("previewCanvas");

  const ctx=
    canvas.getContext("2d");

  const width=700;

  const photoWidth=640;

  const photoHeight=420;

  const gap=18;

  const padding=30;

  const header=80;

  const footer=120;

  canvas.width=width;

  canvas.height=
    padding+
    header+
    (photoHeight*4)+
    (gap*3)+
    footer+
    padding;

  let background="#fff4f7";

  let textColor="#735967";

  if(selectedFrame==="pink")
    background="#ffe4ed";

  if(selectedFrame==="sakura")
    background="#ffeaf1";

  if(selectedFrame==="lavender")
    background="#eee5f8";

  if(selectedFrame==="blue")
    background="#e2f3fc";

  if(selectedFrame==="star"){
    background="#332d4c";
    textColor="#ffffff";
  }

  if(selectedFrame==="cloud")
    background="#edf8ff";

  if(selectedFrame==="teddy")
    background="#ecd6c0";

  if(selectedFrame==="strawberry")
    background="#ffdce4";

  if(selectedFrame==="flower")
    background="#f4e1f0";

  if(selectedFrame==="minimal")
    background="#eeeae7";


  /* BACKGROUND */

  ctx.fillStyle=background;

  ctx.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /* HEADER */

  ctx.fillStyle=textColor;

  ctx.textAlign="center";

  ctx.font="bold 28px Georgia";

  ctx.fillText(
    "YOUR PHOTOBOX",
    width/2,
    52
  );


  /* PHOTOS */

  let loaded=0;

  photos.forEach((photo,index)=>{

    const img=new Image();

    img.onload=function(){

      const x=padding;

      const y=
        padding+
        header+
        index*(photoHeight+gap);

      /*
        CROP FOTO SUPAYA
        PROPORSIONAL
      */

      const sourceRatio=
        img.width/img.height;

      const targetRatio=
        photoWidth/photoHeight;

      let sx=0;
      let sy=0;
      let sw=img.width;
      let sh=img.height;

      if(sourceRatio>targetRatio){

        sw=
          img.height*
          targetRatio;

        sx=
          (img.width-sw)/2;

      }

      else{

        sh=
          img.width/
          targetRatio;

        sy=
          (img.height-sh)/2;

      }

      ctx.save();

      /* FOTO */

      ctx.drawImage(
        img,
        sx,
        sy,
        sw,
        sh,
        x,
        y,
        photoWidth,
        photoHeight
      );

      ctx.restore();


      /* FRAME BORDER */

      ctx.lineWidth=7;

      ctx.strokeStyle=
        selectedFrame==="star"
        ? "#d9c9f0"
        : "rgba(255,255,255,.95)";

      ctx.strokeRect(
        x,
        y,
        photoWidth,
        photoHeight
      );


      loaded++;

      if(loaded===4){

        drawDecorations(
          ctx,
          width,
          canvas.height,
          textColor
        );

        const finalImage=
          canvas.toDataURL(
            "image/jpeg",
            .95
          );

        document.getElementById(
          "downloadButton"
        ).href=finalImage;

      }

    };

    img.src=photo;

  });

}


/* ================= DECORATIONS ================= */

function drawDecorations(
  ctx,
  width,
  height,
  textColor
){

  ctx.textAlign="center";

  /* DATE */

  if(showDate){

    const date=
      new Date();

    const formatted=
      String(date.getDate())
      .padStart(2,"0")
      +" • "+
      String(date.getMonth()+1)
      .padStart(2,"0")
      +" • "+
      date.getFullYear();

    ctx.font="18px Arial";

    ctx.fillStyle=textColor;

    ctx.fillText(
      formatted,
      width/2,
      height-78
    );

  }


  /* TEXT */

  if(customText.trim()!==""){

    ctx.font=
      "bold 24px Arial";

    ctx.fillStyle=textColor;

    ctx.fillText(
      customText,
      width/2,
      height-45
    );

  }


  /* STICKERS */

  if(stickers.length){

    ctx.font="32px Arial";

    let x=55;

    stickers.forEach(sticker=>{

      ctx.fillText(
        sticker,
        x,
        height-42
      );

      x+=45;

      if(x>width-50){
        x=55;
      }

    });

  }

}

</script>

</body>
</html>
