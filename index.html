<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Photobox ✦</title>

<style>

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: "Trebuchet MS", Arial, sans-serif;
  background:
    radial-gradient(circle at 10% 10%, #f8dce7 0, transparent 25%),
    radial-gradient(circle at 90% 20%, #e5def8 0, transparent 25%),
    linear-gradient(135deg, #fffaf7, #f8f1f5);
  color: #4d4148;
  text-align: center;
  min-height: 100vh;
}

/* DECORATION */

body::before {
  content: "✦  ˚  ✧  ♡  ˚  ✦  ˚  ✧";
  position: fixed;
  top: 90px;
  left: 0;
  width: 100%;
  color: rgba(190,145,170,0.25);
  font-size: 22px;
  letter-spacing: 25px;
  pointer-events: none;
}

/* HEADER */

header {
  padding: 24px 20px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(190,150,170,0.15);
  font-size: 22px;
  font-weight: bold;
  letter-spacing: 4px;
  color: #806274;
}

header span {
  color: #c58ba5;
}

/* MAIN */

.camera-section {
  padding: 45px 18px 60px;
  max-width: 900px;
  margin: auto;
}

h1 {
  font-family: Georgia, serif;
  font-size: clamp(34px, 7vw, 56px);
  color: #6e5864;
  margin-bottom: 10px;
  letter-spacing: -1px;
}

.subtitle {
  color: #9a858f;
  margin-bottom: 30px;
  font-size: 15px;
}

/* CAMERA CARD */

.camera-box {
  max-width: 720px;
  margin: auto;
  padding: 10px;
  background: linear-gradient(135deg, #dca9bd, #bca9d8);
  border-radius: 28px;
  box-shadow:
    0 20px 50px rgba(120,90,110,0.18),
    0 0 0 7px rgba(255,255,255,0.7);
}

.camera-box::before {
  content: "♡  PHOTO TIME  ♡";
  display: block;
  color: white;
  font-size: 12px;
  letter-spacing: 3px;
  padding: 10px;
  font-weight: bold;
}

video {
  width: 100%;
  display: block;
  border-radius: 20px;
  transform: scaleX(-1);
  background: #eee;
}

/* PHOTO COUNTDOWN */

#timer {
  font-size: 64px;
  font-weight: bold;
  color: #a56f89;
  margin: 20px;
  min-height: 75px;
  text-shadow: 0 4px 15px rgba(180,120,150,0.2);
}

/* SESSION TIMER */

.session-box {
  width: 230px;
  margin: 15px auto 25px;
  padding: 15px 20px;
  background: rgba(255,255,255,0.8);
  border: 1px solid rgba(190,150,170,0.25);
  border-radius: 22px;
  box-shadow: 0 10px 30px rgba(120,90,110,0.1);
}

.session-label {
  font-size: 11px;
  letter-spacing: 3px;
  font-weight: bold;
  color: #a58b98;
  margin-bottom: 5px;
}

#sessionTimer {
  font-size: 38px;
  font-weight: bold;
  letter-spacing: 3px;
  color: #765b69;
}

/* BUTTONS */

.controls {
  margin-top: 20px;
}

button {
  border: none;
  padding: 14px 25px;
  border-radius: 50px;
  background: linear-gradient(135deg, #b985a0, #927da9);
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin: 5px;
  box-shadow: 0 8px 20px rgba(140,100,140,0.18);
  transition: 0.2s;
}

button:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 25px rgba(140,100,140,0.25);
}

button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
}

/* RESULT */

#result {
  margin-top: 50px;
}

#result h2 {
  font-family: Georgia, serif;
  font-size: 30px;
  color: #765d69;
  margin-bottom: 20px;
}

/* PHOTO GRID */

#photoGrid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 18px;
}

.photo-box {
  width: 240px;
  padding: 15px;
  background: rgba(255,255,255,0.82);
  border-radius: 22px;
  box-shadow: 0 12px 30px rgba(110,80,100,0.12);
  border: 1px solid rgba(190,150,170,0.18);
}

.photo-box h3 {
  color: #967487;
  font-size: 15px;
  margin-bottom: 10px;
  letter-spacing: 1px;
}

.photo-box img {
  width: 100%;
  border-radius: 15px;
  display: block;
  margin-bottom: 12px;
}

/* PHOTO STRIP */

#photostrip {
  margin-top: 40px;
}

#photostrip h2 {
  font-family: Georgia, serif;
  color: #765d69;
  margin-bottom: 20px;
}

#photostrip img {
  width: 100%;
  max-width: 380px;
  border-radius: 16px;
  box-shadow:
    0 20px 45px rgba(100,70,90,0.2);
  border: 8px solid white;
}

/* DOWNLOAD */

.download {
  display: none;
  text-decoration: none;
  background: linear-gradient(135deg, #b985a0, #927da9);
  color: white;
  padding: 14px 28px;
  border-radius: 50px;
  margin: 20px 0;
  font-weight: bold;
  box-shadow: 0 8px 20px rgba(140,100,140,0.18);
}

/* FOOTER */

footer {
  margin-top: 60px;
  padding: 30px 20px;
  background: rgba(110,85,100,0.95);
  color: #f9edf3;
  font-size: 13px;
  letter-spacing: 2px;
}

footer::before {
  content: "✦  ";
}

footer::after {
  content: "  ✦";
}

</style>
</head>


<body>

<header>
  YOUR <span>PHOTOBOX</span> ♡
</header>


<section class="camera-section">

  <h1>
    Capture Your Moment ✦
  </h1>

  <p class="subtitle">
    little moments, pretty memories ♡
  </p>


  <div class="camera-box">

    <video
      id="camera"
      autoplay
      playsinline>
    </video>

  </div>


  <div id="timer"></div>


  <div class="session-box">

    <div class="session-label">
      ⏱ TIME LEFT
    </div>

    <div id="sessionTimer">
      05:00
    </div>

  </div>


  <div class="controls">

    <button
      onclick="startCamera()"
      id="cameraButton">

      📸 Start Camera

    </button>


    <button
      onclick="startPhotobooth()"
      id="boothButton">

      ✨ Start Photobooth

    </button>

  </div>


  <canvas
    id="canvas"
    style="display:none;">
  </canvas>


  <div id="result">

    <h2>
      Your Photos ♡
    </h2>

    <div id="photoGrid"></div>


    <div id="photostrip"></div>


    <button
      onclick="createPhotostrip()"
      id="createStripButton"
      style="display:none;">

      ✨ Create Photostrip

    </button>


    <br>


    <a
      id="downloadStrip"
      class="download"
      download="photostrip.jpg">

      ♡ Download Photostrip

    </a>


    <br>


    <button
      onclick="retakeAll()"
      id="retakeAllButton"
      style="display:none;">

      ↻ Retake All

    </button>

  </div>

</section>


<footer>
  2026 YOUR PHOTOBOX
</footer>


<script>

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("canvas");

const timer =
  document.getElementById("timer");

let stream = null;

let photos = [];

let currentPhoto = 0;


/* SESSION */

let sessionTime = 300;

let sessionInterval = null;

let sessionActive = false;


/* CAMERA */

async function startCamera() {

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      alert(
        "Browser tidak mendukung akses kamera."
      );

      return;

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: "user"
        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    alert(
      "Kamera berhasil terhubung! ♡"
    );

  }

  catch (error) {

    alert(
      "Kamera gagal dibuka: " +
      error.name +
      " - " +
      error.message
    );

    console.error(error);

  }

}


/* START PHOTO SESSION */

function startPhotobooth() {

  if (!stream) {

    alert(
      "Nyalakan kamera dulu dengan tombol Start Camera."
    );

    return;

  }


  if (!sessionActive) {

    startSessionTimer();

  }


  photos = [];

  currentPhoto = 0;


  document.getElementById(
    "photoGrid"
  ).innerHTML = "";


  document.getElementById(
    "photostrip"
  ).innerHTML = "";


  document.getElementById(
    "downloadStrip"
  ).style.display =
    "none";


  document.getElementById(
    "createStripButton"
  ).style.display =
    "none";


  document.getElementById(
    "retakeAllButton"
  ).style.display =
    "none";


  takeBoothPhoto();

}


/* TAKE PHOTO */

function takeBoothPhoto() {

  if (!sessionActive) {

    alert(
      "Waktu photobox sudah habis."
    );

    return;

  }


  currentPhoto++;

  let count = 5;

  timer.innerText = count;


  const countdown =
    setInterval(() => {

      count--;


      if (count > 0) {

        timer.innerText =
          count;

      }

      else {

        clearInterval(countdown);

        timer.innerText = "📸";


        setTimeout(() => {

          canvas.width =
            video.videoWidth;

          canvas.height =
            video.videoHeight;


          const context =
            canvas.getContext("2d");


          context.save();

          context.translate(
            canvas.width,
            0
          );

          context.scale(
            -1,
            1
          );


          context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );


          context.restore();


          const image =
            canvas.toDataURL(
              "image/jpeg",
              0.95
            );


          photos[
            currentPhoto - 1
          ] = image;


          showPhoto(
            currentPhoto - 1,
            image
          );


          timer.innerText = "";


          if (
            currentPhoto < 4 &&
            sessionActive
          ) {

            setTimeout(() => {

              takeBoothPhoto();

            }, 1000);

          }

          else {

            document.getElementById(
              "retakeAllButton"
            ).style.display =
              "inline-block";


            document.getElementById(
              "createStripButton"
            ).style.display =
              "inline-block";

          }

        }, 500);

      }

    }, 1000);

}


/* SHOW PHOTO */

function showPhoto(index, image) {

  const grid =
    document.getElementById(
      "photoGrid"
    );


  let oldPhoto =
    document.getElementById(
      "photo-" + index
    );


  if (oldPhoto) {
    oldPhoto.remove();
  }


  const box =
    document.createElement("div");


  box.id =
    "photo-" + index;


  box.className =
    "photo-box";


  box.innerHTML = `

    <h3>
      ✦ Foto ${index + 1} ✦
    </h3>

    <img
      src="${image}"
    >

    <button
      onclick="retakePhoto(${index})">

      ↻ Retake Foto

    </button>

  `;


  grid.appendChild(box);

}


/* RETAKE ONE */

function retakePhoto(index) {

  if (!sessionActive) {

    alert(
      "Waktu photobox sudah habis."
    );

    return;

  }


  if (!stream) {

    alert(
      "Nyalakan kamera dulu."
    );

    return;

  }


  currentPhoto =
    index + 1;


  let count = 5;

  timer.innerText =
    count;


  const countdown =
    setInterval(() => {

      count--;


      if (count > 0) {

        timer.innerText =
          count;

      }

      else {

        clearInterval(countdown);

        timer.innerText = "📸";


        setTimeout(() => {

          canvas.width =
            video.videoWidth;

          canvas.height =
            video.videoHeight;


          const context =
            canvas.getContext("2d");


          context.save();

          context.translate(
            canvas.width,
            0
          );

          context.scale(
            -1,
            1
          );


          context.drawImage(
            video,
            0,
            0,
            canvas.width,
            canvas.height
          );


          context.restore();


          const image =
            canvas.toDataURL(
              "image/jpeg",
              0.95
            );


          photos[index] =
            image;


          showPhoto(
            index,
            image
          );


          timer.innerText = "";

        }, 500);

      }

    }, 1000);

}


/* RETAKE ALL */

function retakeAll() {

  if (!sessionActive) {

    alert(
      "Waktu photobox sudah habis."
    );

    return;

  }


  photos = [];

  currentPhoto = 0;


  document.getElementById(
    "photoGrid"
  ).innerHTML = "";


  document.getElementById(
    "photostrip"
  ).innerHTML = "";


  document.getElementById(
    "downloadStrip"
  ).style.display =
    "none";


  document.getElementById(
    "createStripButton"
  ).style.display =
    "none";


  document.getElementById(
    "retakeAllButton"
  ).style.display =
    "none";


  startPhotobooth();

}


/* PHOTO STRIP */

function createPhotostrip() {

  if (photos.length < 4) {

    alert(
      "Selesaikan 4 foto dulu."
    );

    return;

  }


  const stripCanvas =
    document.createElement("canvas");


  const ctx =
    stripCanvas.getContext("2d");


  const width = 700;

  const photoHeight = 500;

  const gap = 20;

  const padding = 30;

  const footerHeight = 100;


  stripCanvas.width =
    width;


  stripCanvas.height =
    padding +
    (photoHeight * 4) +
    (gap * 3) +
    footerHeight +
    padding;


  ctx.fillStyle =
    "#fffaf8";


  ctx.fillRect(
    0,
    0,
    stripCanvas.width,
    stripCanvas.height
  );


  let loaded = 0;


  photos.forEach(
    (image, index) => {

      const img =
        new Image();


      img.onload =
        function() {

          const y =
            padding +
            (
              index *
              (
                photoHeight +
                gap
              )
            );


          ctx.drawImage(
            img,
            padding,
            y,
            width -
              (padding * 2),
            photoHeight
          );


          loaded++;


          if (loaded === 4) {

            const footerY =
              padding +
              (photoHeight * 4) +
              (gap * 3);


            ctx.fillStyle =
              "#fffaf8";


            ctx.fillRect(
              0,
              footerY,
              width,
              footerHeight
            );


            ctx.fillStyle =
              "#765d69";


            ctx.font =
              "bold 28px Arial";


            ctx.textAlign =
              "center";


            ctx.fillText(
              "YOUR PHOTOBOX ✦",
              width / 2,
              footerY + 60
            );


            const finalImage =
              stripCanvas.toDataURL(
                "image/jpeg",
                0.95
              );


            const strip =
              document.getElementById(
                "photostrip"
              );


            strip.innerHTML = `

              <h2>
                Your Photostrip ✨
              </h2>

              <img
                src="${finalImage}"
              >

            `;


            const downloadStrip =
              document.getElementById(
                "downloadStrip"
              );


            downloadStrip.href =
              finalImage;


            downloadStrip.style.display =
              "inline-block";

          }

        };


      img.src =
        image;

    }

  );

}


/* 5 MINUTE SESSION */

function startSessionTimer() {

  sessionTime = 300;

  sessionActive = true;


  updateSessionTimer();


  sessionInterval =
    setInterval(() => {

      sessionTime--;

      updateSessionTimer();


      if (sessionTime <= 0) {

        clearInterval(
          sessionInterval
        );


        sessionActive = false;

        sessionTime = 0;


        updateSessionTimer();


        document.getElementById(
          "boothButton"
        ).disabled = true;


        document.getElementById(
          "retakeAllButton"
        ).disabled = true;


        alert(
          "⏰ Waktu photobox sudah habis! Kamu masih bisa memilih frame dan download hasil foto ♡"
        );

      }

    }, 1000);

}


/* UPDATE TIMER */

function updateSessionTimer() {

  const minutes =
    Math.floor(
      sessionTime / 60
    );


  const seconds =
    sessionTime % 60;


  document.getElementById(
    "sessionTimer"
  ).innerText =

    String(minutes)
      .padStart(2, "0")

    + ":" +

    String(seconds)
      .padStart(2, "0");

}

</script>

</body>
</html>
