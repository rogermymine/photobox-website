<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Photobox</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f8f5f2;
      color: #222;
      text-align: center;
    }

    header {
      padding: 25px;
      background: white;
      font-size: 24px;
      font-weight: bold;
    }

    .camera-section {
      padding: 40px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    .subtitle {
      margin-bottom: 30px;
      color: #666;
    }

    .camera-box {
      max-width: 700px;
      margin: auto;
      background: #111;
      border-radius: 20px;
      padding: 15px;
    }

    video {
      width: 100%;
      display: block;
      border-radius: 15px;
      transform: scaleX(-1);
    }

    .controls {
      margin-top: 25px;
    }

    button {
      border: none;
      padding: 16px 35px;
      border-radius: 30px;
      background: #222;
      color: white;
      font-size: 17px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.8;
    }

    #timer {
      font-size: 60px;
      font-weight: bold;
      margin: 20px;
      min-height: 70px;
    }

    #result {
      margin-top: 40px;
    }

    #photo {
      max-width: 90%;
      border-radius: 15px;
      display: none;
      margin: 20px auto;
    }

    .download {
      display: none;
      text-decoration: none;
      background: #222;
      color: white;
      padding: 14px 30px;
      border-radius: 30px;
    }

    footer {
      margin-top: 60px;
      padding: 25px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>

  <header>
    YOUR PHOTOBOX
  </header>

  <section class="camera-section">

    <h1>Capture Your Moment ✦</h1>

    <p class="subtitle">
      Take your photo directly from our photobox.
    </p>

    <div class="camera-box">

      <video id="camera" autoplay playsinline></video>

    </div>

    <div id="timer"></div>

    <div class="controls">

      <button onclick="startCamera()">
        📸 Start Camera
      </button>

      <button onclick="takePhoto()">
        Take Photo
      </button>

    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <div id="result">

      <h2>Your Photo</h2>

      <img id="photo">

      <br>

      <a id="download" class="download" download="photobox.jpg">
        Download Photo
      </a>

    </div>

  </section>

  <footer>
    © 2026 Your Photobox
  </footer>


  <script>
const video = document.getElementById("camera");
const canvas = document.getElementById("canvas");
const photo = document.getElementById("photo");
const download = document.getElementById("download");
const timer = document.getElementById("timer");

let stream = null;

async function startCamera() {
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      alert("Browser tidak mendukung akses kamera di halaman ini.");
      return;
    }

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user"
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    alert("Kamera berhasil terhubung!");

  } catch (error) {
    alert("Kamera gagal dibuka: " + error.name + " - " + error.message);
    console.error(error);
  }
}

function takePhoto() {

  if (!stream) {
    alert("Nyalakan kamera dulu dengan tombol Start Camera.");
    return;
  }

  let count = 3;

  timer.innerText = count;

  const countdown = setInterval(() => {

    count--;

    if (count > 0) {
      timer.innerText = count;
    } else {

      clearInterval(countdown);

      timer.innerText = "📸";

      setTimeout(() => {

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        const context = canvas.getContext("2d");

        context.save();
        context.translate(canvas.width, 0);
        context.scale(-1, 1);

        context.drawImage(
          video,
          0,
          0,
          canvas.width,
          canvas.height
        );

        context.restore();

        const image = canvas.toDataURL("image/jpeg", 0.95);

        photo.src = image;
        photo.style.display = "block";

        download.href = image;
        download.style.display = "inline-block";

        timer.innerText = "";

      }, 500);
    }

  }, 1000);
}
</script>
</body>
</html>
